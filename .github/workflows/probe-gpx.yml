name: Probe
on:
  push:
    branches: [claude/project-thread-qveb8b]
    paths: ["probe/**", ".github/workflows/probe-gpx.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python probe/radnet_probe.py
